name: Deploy to CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed build assets: cache for a year
      - name: Upload immutable assets
        run: |
          aws s3 sync ./out/_next/static s3://${{ secrets.S3_BUCKET }}/_next/static \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else (HTML, other files): no caching so updates show immediately
      - name: Upload the rest and remove stale files
        run: |
          aws s3 sync ./out s3://${{ secrets.S3_BUCKET }} \
            --exclude "_next/static/*" \
            --cache-control "no-cache" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"